# Sitio de Apache para ZonaOcio.
# - /phpmyadmin la atiende Apache directamente (paquete phpmyadmin).
# - Todo lo demás se envía a Gunicorn (Django) en 127.0.0.1:8000.
# Copiar a /etc/apache2/sites-available/zonaocio.conf
<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    ProxyPass        /phpmyadmin !
    ProxyPass        /            http://127.0.0.1:8000/
    ProxyPassReverse /            http://127.0.0.1:8000/

    ErrorLog  ${APACHE_LOG_DIR}/zonaocio_error.log
    CustomLog ${APACHE_LOG_DIR}/zonaocio_access.log combined
</VirtualHost>
