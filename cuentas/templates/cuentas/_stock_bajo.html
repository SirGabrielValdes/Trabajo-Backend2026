{% comment %}Videojuegos con poco stock. Parámetro: stock_bajo{% endcomment %}
<ul class="list-group list-group-flush">
    {% for juego in stock_bajo %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'videojuegos:detalle' juego.pk %}" class="text-decoration-none">{{ juego.titulo }}</a>
        <span class="badge {% if juego.stock == 0 %}text-bg-danger{% else %}text-bg-warning{% endif %}">{{ juego.stock }} u.</span>
    </li>
    {% empty %}
    <li class="list-group-item text-muted">Todos los videojuegos tienen stock suficiente.</li>
    {% endfor %}
</ul>
