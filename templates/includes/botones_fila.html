{% comment %}
Botones Modificar y Eliminar de un registro.
Parámetros: url_modificar, url_eliminar
{% endcomment %}
<div class="btn-group btn-group-sm" role="group" aria-label="Acciones">

    <a href="{{ url_eliminar }}" class="btn btn-outline-danger">Eliminar</a>
</div>
