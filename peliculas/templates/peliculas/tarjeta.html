{% load static %}
<div class="card h-100 tarjeta">
    <img src="{% static pelicula.imagen %}" class="card-img-top portada" alt="Póster de {{ pelicula.titulo }}">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge text-bg-danger">{{ pelicula.genero }}</span>
            <span class="badge text-bg-light border">{{ pelicula.clasificacion }}</span>
        </div>
        <h5 class="card-title">{{ pelicula.titulo }}</h5>
        <p class="card-text text-muted small mb-1">{{ pelicula.director }}</p>
        <p class="card-text small mb-2">{{ pelicula.anio }} &middot; {{ pelicula.duracion_texto }}</p>
        <p class="text-warning mt-auto mb-2" title="{{ pelicula.calificacion }} / 10">{{ pelicula.estrellas }}</p>
        <a href="{% url 'peliculas:detalle' pelicula.id %}" class="btn btn-outline-danger btn-sm">Ver ficha</a>
    </div>
</div>
